[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xinput-recorder"
version = "0.1.0"
description = "Read-only, high-frequency XInput controller input recorder for research"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["pandas>=2"]

[project.scripts]
xinput-record = "xinput_recorder.cli:record_main"
xinput-selftest = "xinput_recorder.cli:selftest_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
